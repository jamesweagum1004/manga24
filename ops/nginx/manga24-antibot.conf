# Manga24 origin-side request shaping.
# Installed into /etc/nginx/conf.d (the http context).
# Keep this in dry-run until Nginx's client IP is verified, especially behind Bunny.

# Limit only Manga24's public hostnames so other virtual hosts in the same Nginx
# instance are unaffected. Do not count static assets, SEO discovery endpoints,
# admin traffic, or trusted internal automation.
map $host $manga24_public_host {
    default 0;
    ~*^(?:www\.)?manga24\.net$ 1;
}

map $request_uri $manga24_limitable_uri {
    default                                      1;
    ~^/_next/                                   0;
    ~^/(?:favicon\.ico|robots\.txt|sitemap\.xml)$ 0;
    ~^/sitemaps/                                0;
    ~^/media/thumbnail(?:\?|$)                 0;
    ~^/uploads/                                 0;
    ~^/manga1004(?:/|$)                         0;
    ~^/admin(?:/|$)                             0;
    ~^/api/internal/                            0;
}

map "$manga24_public_host:$manga24_limitable_uri" $manga24_antibot_key {
    default "";
    "1:1" $binary_remote_addr;
}

limit_req_zone  $manga24_antibot_key zone=manga24_public_rate:20m rate=3r/s;
limit_conn_zone $manga24_antibot_key zone=manga24_public_conn:20m;

# A 60-request burst accommodates normal navigation and crawler fetch bursts.
# Dry-run measures excess traffic without returning errors.
limit_req_status 429;
limit_req_log_level notice;
limit_req_dry_run on;
limit_req zone=manga24_public_rate burst=60 nodelay;

limit_conn_status 429;
limit_conn_log_level notice;
limit_conn_dry_run on;
limit_conn manga24_public_conn 30;
