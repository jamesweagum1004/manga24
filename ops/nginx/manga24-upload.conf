# Manga24 large upload and long-running proxy settings.
# This file is installed in /etc/nginx/conf.d, which is loaded inside nginx's http block.

client_max_body_size 512m;
client_body_timeout 900s;
send_timeout 900s;

proxy_connect_timeout 60s;
proxy_send_timeout 900s;
proxy_read_timeout 900s;
proxy_request_buffering off;
