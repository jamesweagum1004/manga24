services:
  postgres:
    image: postgres:16-alpine
    container_name: manga24-postgres
    environment:
      POSTGRES_USER: manga24
      POSTGRES_PASSWORD: manga24
      POSTGRES_DB: manga24
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manga24 -d manga24"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
