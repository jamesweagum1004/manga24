# Enforcement config for Manga24 behind Bunny.
# Generated by ops/install-nginx-antibot.sh; never commit the rendered secret.

# The origin-key map may contain a 64-character hex key. Allow enough room in
# each hash bucket for the longest supported URL-safe key (up to 128 chars).
map_hash_bucket_size 256;

map $host $manga24_public_host {
    default 0;
    ~*^(?:www\.)?manga24\.net$ 1;
}

map $request_uri $manga24_limitable_uri {
    default                                      1;
    ~^/_next/                                   0;
    ~^/(?:favicon\.ico|robots\.txt|sitemap\.xml)$ 0;
    ~^/sitemaps/                                0;
    ~^/media/thumbnail(?:\?|$)                 0;
    ~^/uploads/                                 0;
    ~^/manga1004(?:/|$)                         0;
    ~^/admin(?:/|$)                             0;
    ~^/api/internal/                            0;
}

map $http_x_manga24_origin_key $manga24_origin_authorized {
    default 0;
    "__MANGA24_ORIGIN_KEY__" 1;
}

map $http_x_manga24_client_ip $manga24_effective_client_ip {
    default $http_x_manga24_client_ip;
    ""      $binary_remote_addr;
}

map "$manga24_public_host:$manga24_origin_authorized:$manga24_limitable_uri" $manga24_antibot_key {
    default "";
    "1:1:1" $manga24_effective_client_ip;
}

limit_req_zone  $manga24_antibot_key zone=manga24_public_rate:20m rate=3r/s;
limit_conn_zone $manga24_antibot_key zone=manga24_public_conn:20m;

limit_req_status 429;
limit_req_log_level notice;
limit_req_dry_run off;
limit_req zone=manga24_public_rate burst=60 nodelay;

limit_conn_status 429;
limit_conn_log_level notice;
limit_conn_dry_run off;
limit_conn manga24_public_conn 30;

# Exact public hostnames win over the catch-all site vhost. Bunny injects the
# private key and visitor IP; requests sent straight to the VPS receive 403.
server {
    listen 80;
    listen [::]:80;
    server_name manga24.net www.manga24.net;

    if ($manga24_origin_authorized = 0) { return 403; }

    client_max_body_size 512M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $manga24_effective_client_ip;
        proxy_set_header X-Forwarded-For $manga24_effective_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Manga24-Origin-Key "";
        proxy_set_header X-Manga24-Client-IP "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Do not leave the catch-all site vhost as an origin bypass for arbitrary Host
# values or direct-IP requests. Exact public and direct hostnames still win.
server {
    listen 80;
    listen [::]:80;
    server_name ~^.+$;
    return 444;
}
